# Serves the SPA and proxies API + WebSocket to terra-api (same origin → no CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the api hostname via Docker's embedded DNS so that recreating
  # the api container (new IP) does not leave nginx pointing at a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    set $sio_upstream http://api:4000;
    proxy_pass $sio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
