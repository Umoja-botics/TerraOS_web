services:
  - type: web
    name: terraos-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @terra-os/api... build
    startCommand: pnpm --filter @terra-os/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_URL
        sync: false
      - key: BRIDGE_BASE_URL
        sync: false
      - key: SIM_BRIDGE_URL
        value: "https://terraos-sim.onrender.com"
      - key: TYPEORM_SYNCHRONIZE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: terraos-db
          property: connectionString

  - type: web
    name: terraos-sim
    runtime: python
    plan: free
    buildCommand: pip install -r apps/bridge/requirements.txt
    startCommand: cd apps/bridge && uvicorn sim_bridge:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ROBOT_ID
        value: "00000000-0000-0000-0000-000000000001"
      - key: TERRA_API_URL
        value: "https://terraos-api.onrender.com"

databases:
  - name: terraos-db
    plan: free
    databaseName: terraos
    user: terraos
